name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Instalar dependencias
        run: npm install

        - name: Iniciar servidor
        run: npm index.js &

      - name: Esperar servidor
        run: sleep 5

      - name: ejecutar pruebas
        run: npm test